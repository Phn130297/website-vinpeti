name: Deployment website auto
# Kích hoạt workflow khi có code mới được push hoặc merge vào nhánh production
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd /home/website-vinpeti
            git fetch origin
            git checkout main
            git pull
            npm install
            npm run build
            pm2 reload website-vinpeti
